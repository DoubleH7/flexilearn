name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requires-python is >=3.12. Add newer versions here once their wheels
        # are confirmed available for the whole dependency tree.
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        # The video extra lets the write_mp4 test run instead of skipping.
        run: uv sync --extra video --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest

      - name: End-to-end smoke test
        run: uv run python smoke_test.py

      - name: Run the bundled example
        run: uv run flexilearn examples/minimal/config.yml --definitions examples/minimal/definitions

  build:
    name: build + install wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      # Guards the packaging regression where an installed wheel could not run at
      # all, because discovery resolved definitions/ relative to the package.
      - name: Install the wheel into a clean environment and run its CLI
        run: |
          uv venv /tmp/wheel-env
          VIRTUAL_ENV=/tmp/wheel-env uv pip install dist/*.whl
          cd /tmp
          /tmp/wheel-env/bin/python -c "import flexilearn; print(flexilearn.__all__)"
          /tmp/wheel-env/bin/flexilearn --help

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
