[project]
name = "flexilearn"
version = "0.1.0"
description = "A configuration-driven PyTorch training framework for rapid, reproducible experimentation"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Hesam Haddad" },
]
maintainers = [
    { name = "Hesam Haddad" },
]
keywords = [
    "pytorch",
    "machine-learning",
    "training-framework",
    "reproducible-research",
    "experiment-tracking",
    "mlflow",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    # --- framework core ---
    "torch>=2.0",
    "numpy>=1.24",
    "rich>=13.0",
    "pydantic[email]>=2.12.5",
    "mlflow>=2.9",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0",
    "psutil>=7.2.2",
]

[project.optional-dependencies]
# GPU system metrics for MLflow (logging.system_metrics: true).
gpu = [
    "nvidia-ml-py>=13.610.43",
]
# Rollout video encoding (flexilearn.sim.write_mp4).
video = [
    "imageio>=2.31",
    "imageio-ffmpeg>=0.4.9",
]

[project.urls]
Homepage = "https://github.com/DoubleH7/flexilearn"
Repository = "https://github.com/DoubleH7/flexilearn"
Issues = "https://github.com/DoubleH7/flexilearn/issues"
Changelog = "https://github.com/DoubleH7/flexilearn/blob/main/CHANGELOG.md"

[project.scripts]
flexilearn = "flexilearn.entry:main"
flexilearn-registry = "flexilearn.registry_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Only the flexilearn package is installed. definitions/ is discovered at
# runtime by path (see flexilearn/discovery.py).
packages = ["flexilearn"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "BLE",  # blind except
]
ignore = [
    "E501",  # line length is handled by the formatter
    "B008",  # function call in default argument
]

[tool.ruff.lint.isort]
# tests/ import the shared fixtures module directly.
known-first-party = ["flexilearn", "conftest"]

[tool.ruff.lint.per-file-ignores]
# Tests and the example register components for their side effects and assert
# on framework internals.
"tests/*" = ["F401"]
"examples/*" = ["F401"]
